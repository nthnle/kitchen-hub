<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="display on-home">
  <!-- Clock and weather for every tab except Home, which draws its own. -->
  <header class="top">
    <div>
      <div id="clock" class="clock"></div>
      <div id="date" class="date"></div>
    </div>
    <div id="weather" class="weather"></div>
  </header>
  <div id="alerts" class="alerts"></div>

  <main>
    <section id="view-home" class="view active"></section>

    <section id="view-calendar" class="view">
      <div class="cal-layout">
        <div class="today-panel">
          <div id="notes" class="notes"></div>
          <h2>Today</h2>
          <div id="today-list"></div>
          <h2 class="mt">Tomorrow</h2>
          <div id="tomorrow-list"></div>
          <div id="countdowns"></div>
        </div>
        <div id="week" class="week"></div>
      </div>
      <div id="cal-status" class="status"></div>
    </section>

    <section id="view-chores" class="view">
      <form id="chore-add" class="chore-add" autocomplete="off">
        <input id="ca-title" placeholder="New chore, e.g. Feed the dog  (press N)" maxlength="80" aria-label="New chore">
        <select id="ca-person" aria-label="Who"></select>
        <select id="ca-when" aria-label="When"></select>
        <div id="ca-days" class="days" role="group" aria-label="Days (none = every day)"></div>
        <span id="ca-days-hint" class="muted small">No days = every day</span>
        <input id="ca-date" type="date" aria-label="Date" hidden>
        <button>Add chore</button>
      </form>
      <div id="chores" class="chore-cols"></div>
    </section>

    <section id="view-grocery" class="view">
      <div class="grocery-wrap">
        <form id="grocery-form" class="add-row">
          <input id="grocery-input" placeholder="Add an item…" autocomplete="off">
          <button>Add</button>
        </form>
        <div id="grocery-quick"></div>
        <ul id="grocery" class="checklist"></ul>
        <button id="grocery-clear" class="ghost">Remove checked items</button>
      </div>
    </section>

    <section id="view-watch" class="view">
      <div id="services" class="services"></div>
      <p class="hint">Opens in a new window. Close that window to come back here.</p>
    </section>
  </main>

  <nav class="tabs" aria-label="Sections">
    <button data-view="home" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5V20h-5.5v-5h-5v5H4z"/></svg><span>Home</span><kbd>1</kbd></button>
    <button data-view="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Week</span><kbd>2</kbd></button>
    <button data-view="chores">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg><span>Chores</span><kbd>3</kbd></button>
    <button data-view="grocery">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.6"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><span>Groceries</span><kbd>4</kbd></button>
    <button data-view="watch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M10 9l4 2-4 2z"/><path d="M8 20h8"/></svg><span>Watch</span><kbd>5</kbd></button>
    <button data-action="frame">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg><span>Photos</span><kbd>6</kbd></button>
  </nav>
  <div id="status-badge" class="status-badge" role="status" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="event-dialog" class="ev-dialog"></dialog>

  <div id="frame" class="frame" hidden>
    <div class="slides"></div>
    <div class="frame-clock"><div id="frame-time"></div><div id="frame-date"></div></div>
  </div>

  <script src="shared.js"></script>
  <script src="holidays.js"></script>
  <script src="app.js"></script>
</body>
</html>
